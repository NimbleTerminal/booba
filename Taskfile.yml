version: '3'

vars:
  GOLANGCI_LINT_VERSION: v2.15.0

tasks:
  default:
    desc: 'Default task runs the "test" and "build" tasks'
    deps:
      - test
      - build

  list:
    desc: 'Lists available tasks'
    cmds:
      - task --list-all

  ci:
    desc: 'Run local preflight against pinned dependencies (no publishing)'
    env:
      GOWORK: 'off'
      GOTOOLCHAIN:
        sh: "awk '$1 == \"go\" { print \"go\" $2; exit }' go.mod"
    preconditions:
      - sh: command -v golangci-lint
        msg: 'Install golangci-lint v2.15.0 (see task dev-deps)'
      - sh: command -v actionlint
        msg: 'Install actionlint before running task ci'
      - sh: command -v goreleaser
        msg: 'Install GoReleaser v2 before running task ci'
    # Subprocesses carry GOWORK/GOTOOLCHAIN into every child task.
    # Keep stages sequential: tests/builds consume regenerated assets.
    cmds:
      - task fmt-check go-tidy-check go-verify
      - task assets-check
      - env -u TERM_PROGRAM -u COLORTERM task test
      - task vet go-lint
      - go build ./...
      - task site
      - npm run test:package
      - actionlint
      - task release:check
      - git --no-pager diff --check HEAD

  fmt-check:
    desc: 'Check Go formatting without changing files'
    cmds:
      - |
        project_goroot=$(go env GOROOT)
        fmt_files=$("$project_goroot/bin/gofmt" -l .)
        if [ -n "$fmt_files" ]; then
          printf '%s\n' "$fmt_files"
          exit 1
        fi

  go-tidy-check:
    desc: 'Check module tidiness without changing go.mod or go.sum'
    cmds:
      - go mod tidy -diff

  go-verify:
    desc: 'Verify downloaded Go modules'
    cmds:
      - go mod verify

  vet:
    desc: 'Run Go static checks'
    cmds:
      - go vet ./...

  assets-check:
    desc: 'Regenerate embedded assets and check they match HEAD'
    deps: [npm-deps]
    cmds:
      # Direct commands bypass Task timestamps without forcing a submodule reset.
      - npm run build:embed
      - node scripts/copy-ntwebterm-assets.mjs
      - |
        changes=$(git status --porcelain --untracked-files=all -- serve/static/booba serve/static/ntwebterm serve/static/ghostty-web)
        if [ -n "$changes" ]; then
          printf '%s\n' "$changes"
          echo 'Embedded assets differ from HEAD; review and commit regenerated assets.' >&2
          exit 1
        fi

  dev-deps:
    desc: 'Install developer dependencies'
    cmds:
      - go install 'golang.org/x/tools/cmd/godoc@latest'
      - go install 'golang.org/x/pkgsite/cmd/pkgsite@latest'
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
      - go install github.com/kisielk/errcheck@latest
      - npm install
      - task: install-hooks

  install-hooks:
    desc: 'Install git hooks from .githooks/'
    cmds:
      - git config core.hooksPath .githooks
      - echo "Git hooks installed (pre-commit lints, pre-push checks version tags)"

  npm-deps:
    desc: 'Install npm dependencies'
    deps: [init-submodules]
    run: once
    cmds:
      - npm ci
    sources:
      - .npmrc
      - package.json
      - package-lock.json
      - third_party/ntwebterm/package.json
      - third_party/ntwebterm/dist/*
      - third_party/ntwebterm/ghostty-vt.wasm

  build:
    desc: 'Build all the things'
    deps:
      - build-assets
      - build-cmds

  test:
    desc: 'Test go-booba'
    deps:
      - go-test
      - go-test-wasm
      - npm-test

  npm-test:
    desc: 'Run TypeScript tests'
    deps: [build-serve-assets]
    cmds:
      - npm test

###############################################################################

  go-tidy:
    desc: 'Go tidy all the things'
    run: once
    cmds:
      - go mod tidy

  go-update:
    desc: 'Go update all the dependencies'
    cmds:
      - go get -u ./...

  go-lint:
    desc: Run golangci-lint with errcheck
    env:
      GOTOOLCHAIN:
        sh: "awk '$1 == \"go\" { print \"go\" $2; exit }' go.mod"
    cmds:
      - golangci-lint run --enable=errcheck --timeout=5m ./...

  go-test:
    desc: 'Run Go tests'
    deps: [build-serve-assets]
    cmds:
      - go test ./...

  go-test-wasm:
    desc: 'Run the js/wasm Go tests under Node (the wasm package only builds for the browser)'
    cmds:
      - PATH="$(go env GOROOT)/lib/wasm:$PATH" GOOS=js GOARCH=wasm go test ./wasm/ ./

###############################################################################
# Assets

  build-assets:
    desc: 'Build frontend assets'
    # npm-deps initializes the submodule first, so npm and tsc both see
    # the checked-out ntwebterm package and its prebuilt declarations.
    deps: [npm-deps]
    run: once
    cmds:
      - npm run build:embed
    sources:
      - package.json
      - tsconfig.json
      - tsconfig.embed.json
      - third_party/ntwebterm/dist/ntwebterm.d.ts
      - ts/*.ts
    generates:
      - serve/static/booba/*.js

  build-npm:
    desc: 'Build self-contained npm package to dist/'
    deps: [npm-deps]
    cmds:
      - npm run build

  init-submodules:
    desc: 'Initialize git submodules (third_party/ntwebterm on built ships prebuilt dist/)'
    run: once
    cmds:
      - git submodule update --init --recursive
    # Preserve an initialized checkout, including an intentional dependency
    # bump that has not been staged yet. After switching booba branches, run
    # git submodule update --init --recursive explicitly to sync their pins.
    status:
      - test -e third_party/ntwebterm/.git
      - test -e third_party/ntwebterm/dist/ntwebterm.d.ts

  build-serve-assets:
    desc: 'Copy prebuilt ntwebterm browser runtime assets for go:embed'
    deps: [build-assets, init-submodules]
    run: once
    cmds:
      - node scripts/copy-ntwebterm-assets.mjs
    sources:
      - scripts/copy-ntwebterm-assets.mjs
      - third_party/ntwebterm/dist/*
    generates:
      - serve/static/ghostty-web/ghostty-web.js
      - serve/static/ghostty-web/ghostty-vt.wasm
      - serve/static/ntwebterm/ntwebterm.js
      - serve/static/ntwebterm/__vite-*.js
      - serve/static/ntwebterm/ghostty-vt.wasm

  clean:
    desc: 'Clean commands'
    deps:
      - clean-cmds
      - clean-assets
 
  clean-assets:
    desc: 'Cleans compiled assets'
    cmds:
      - rm -rf dist
      - rm -rf serve/static/booba
      - rm -rf serve/static/ntwebterm
      - rm -rf serve/static/ghostty-web

###############################################################################
# Commands

  build-cmds:
    desc: 'Build all commands'
    deps:
      - build-cmd-booba
      - build-cmd-booba-assets
      - build-cmd-booba-sip-client
      - build-cmd-booba-view-example-native
      - build-cmd-booba-view-example-wasm

  build-cmd-booba-assets:
    desc: 'Build booba-assets command'
    deps: [go-tidy]
    cmds:
      - go build -o bin/booba-assets ./cmd/booba-assets/
    sources:
      - cmd/booba-assets/**/*
      - serve/static/**/*
    generates:
      - bin/booba-assets

  build-cmd-booba:
    desc: 'Build booba command'
    deps: [go-tidy, build-serve-assets]
    cmds:
      - go build -o bin/booba ./cmd/booba/
    sources:
      - cmd/booba/*.go
      - internal/cli/*.go
      - serve/*.go
      - serve/middleware/**/*.go
      - sip/*.go
      - serve/static/**/*
    generates:
      - bin/booba

  build-cmd-booba-sip-client:
    desc: 'Build booba-sip-client command'
    deps: [go-tidy]
    cmds:
      - go build -o bin/booba-sip-client ./cmd/booba-sip-client/
    sources:
      - cmd/booba-sip-client/*.go
      - internal/sipclient/*.go
      - sip/*.go
    generates:
      - bin/booba-sip-client

  build-cmd-booba-view-example-native:
    desc: 'Build booba-view-example command'
    deps: [go-tidy, build-serve-assets]
    cmds:
      - go build -o bin/booba-view-example ./cmd/booba-view-example/
    sources:
      - cmd/booba-view-example/*.go
      - internal/cli/*.go
      - serve/*.go
      - serve/middleware/**/*.go
      - sip/*.go
      - serve/static/**/*
    generates:
      - bin/booba-view-example

  build-cmd-booba-view-example-wasm:
    desc: 'Build booba-view-example command in WASM'
    deps: [go-tidy]
    cmds:
      - GOOS=js GOARCH=wasm go build -o bin/booba-view-example.wasm ./cmd/booba-view-example/
    sources:
      - cmd/booba-view-example/*.go
    generates:
      - bin/booba-view-example.wasm

  site:
    desc: 'Generate the demo site into web/ (WASM builds, runtime assets, HTML)'
    cmds:
      - go run ./cmd/wasm-build

  site-serve:
    desc: 'Serve the generated demo site at http://localhost:3000/booba/'
    preconditions:
      - sh: test -f web/index.html
        msg: "web/index.html is missing; run `task site` first"
      # serve 14 parses --no-port-switching but still moves to a random port, so
      # check the port here to fail loudly instead of serving somewhere unexpected.
      - sh: '! lsof -nP -iTCP:3000 -sTCP:LISTEN -t >/dev/null'
        msg: "port 3000 is already in use; stop that server first (lsof -nP -iTCP:3000 -sTCP:LISTEN)"
    cmds:
      - rm -rf bin/site && mkdir -p bin/site/booba
      - cp -R web/. bin/site/booba/
      - npx -y serve -l 3000 --no-port-switching bin/site

  clean-cmds:
    desc: 'Cleans all commands'
    cmds:
      - rm -f bin/booba
      - rm -f bin/booba-assets
      - rm -f bin/booba-sip-client
      - rm -f bin/booba-view-example
      - rm -f bin/booba-view-example.wasm

###############################################################################
# Documentation generation (via cobra's doc subpackage)

  docs:build:
    desc: 'Regenerate man pages, markdown docs, and shell completions'
    deps:
      - docs:man:build
      - docs:md:build
      - docs:completions:build

  docs:clean:
    desc: 'Remove all generated docs and completions'
    deps:
      - docs:man:clean
      - docs:md:clean
      - docs:completions:clean

  docs:man:build:
    desc: 'Generate man pages into docs/man/'
    deps: [build-cmd-booba]
    cmds:
      - ./bin/booba docs man -o docs/man
    sources:
      - cmd/booba/*.go
      - internal/cli/*.go
    generates:
      - docs/man/booba.1

  docs:man:clean:
    desc: 'Remove generated man pages'
    cmds:
      - rm -rf docs/man

  docs:md:build:
    desc: 'Generate markdown docs into docs/markdown/'
    deps: [build-cmd-booba]
    cmds:
      - ./bin/booba docs markdown -o docs/markdown
    sources:
      - cmd/booba/*.go
      - internal/cli/*.go
    generates:
      - docs/markdown/booba.md

  docs:md:clean:
    desc: 'Remove generated markdown docs'
    cmds:
      - rm -rf docs/markdown

  docs:completions:build:
    desc: 'Regenerate shell completion scripts into completions/'
    deps: [build-cmd-booba]
    cmds:
      - mkdir -p completions
      - ./bin/booba completion bash > completions/booba.bash
      - ./bin/booba completion zsh > completions/booba.zsh
      - ./bin/booba completion fish > completions/booba.fish
    sources:
      - cmd/booba/*.go
      - internal/cli/*.go
    generates:
      - completions/booba.bash
      - completions/booba.zsh
      - completions/booba.fish

  docs:completions:clean:
    desc: 'Remove generated shell completion scripts'
    cmds:
      - rm -f completions/booba.bash completions/booba.zsh completions/booba.fish

###############################################################################
# Release verification

  release:check:
    desc: 'Validate GoReleaser configuration'
    cmds:
      - goreleaser check

  release:snapshot:
    desc: 'Build release artifacts locally without publishing'
    deps: [build-serve-assets]
    cmds:
      - goreleaser release --snapshot --clean
